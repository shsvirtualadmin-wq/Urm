<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Badges & Border Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="70%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="30%" stop-color="#F2B90C" />
      <stop offset="70%" stop-color="#B37B00" />
      <stop offset="100%" stop-color="#FFEA9F" />
    </linearGradient>

    <linearGradient id="goldGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DAA520" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="robotDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="goldEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#F2B90C" />
    </linearGradient>

    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Filters for 3D depth and glows -->
    <filter id="goldDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Speech Bubble / Badge Shape -->
  <g filter="url(#shadow3D)">
    <!-- Main Outer Badge Frame -->
    <path d="M 250 25 
             A 210 210 0 0 1 455 210 
             A 210 210 0 0 1 390 380
             L 420 440
             L 345 425
             A 210 210 0 0 1 45 210
             A 210 210 0 0 1 250 25 Z" 
          fill="url(#bgGlow)" 
          stroke="url(#goldBorder)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="250" cy="220" r="195" fill="none" stroke="#F2B90C" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6" />
  </g>

  <!-- Speech Bubble Icon Overlay Top Right -->
  <g transform="translate(355, 80)" filter="url(#goldDropGlow)">
    <rect x="0" y="0" width="70" height="50" rx="16" fill="#121212" stroke="url(#goldBorder)" stroke-width="4" />
    <path d="M 18 50 L 10 62 L 30 50 Z" fill="#121212" stroke="url(#goldBorder)" stroke-width="4" stroke-linejoin="round" />
    <!-- Dots -->
    <circle cx="20" cy="25" r="4" fill="#F2B90C" />
    <circle cx="35" cy="25" r="4" fill="#F2B90C" />
    <circle cx="50" cy="25" r="4" fill="#F2B90C" />
  </g>

  <!-- ROBOT CHARACTER -->
  <g transform="translate(250, 225)" filter="url(#shadow3D)">
    
    <!-- Body / Torso -->
    <path d="M -75 90 C -75 60, 75 60, 75 90 L 60 150 C 60 165, -60 165, -60 150 Z" fill="url(#robotBody)" />
    <!-- Chest Plate / Emblem -->
    <circle cx="0" cy="115" r="28" fill="#111827" stroke="url(#goldBorder)" stroke-width="3" />
    <!-- Graduation Cap Emblem on Chest -->
    <path d="M 0 100 L 15 108 L 0 116 L -15 108 Z" fill="#F2B90C" />
    <path d="M -9 111 L -9 120 C -9 124, 9 124, 9 120 L 9 111" fill="none" stroke="#F2B90C" stroke-width="2" />
    <path d="M 12 109 L 16 122" stroke="#F2B90C" stroke-width="2" stroke-linecap="round" />

    <!-- Left Arm & Waving Hand -->
    <g transform="translate(-80, 70)">
      <!-- Shoulder Joint -->
      <circle cx="0" cy="0" r="14" fill="url(#robotDark)" stroke="#F2B90C" stroke-width="2" />
      <!-- Arm Segment -->
      <path d="M -5 0 C -35 -20, -50 -50, -45 -80" fill="none" stroke="url(#robotBody)" stroke-width="20" stroke-linecap="round" />
      <!-- Hand / Fingers -->
      <g transform="translate(-48, -90)">
        <circle cx="0" cy="0" r="12" fill="url(#robotDark)" />
        <rect x="-12" y="-18" width="6" height="12" rx="3" fill="url(#robotDark)" />
        <rect x="-4" y="-22" width="6" height="14" rx="3" fill="url(#robotDark)" />
        <rect x="4" y="-20" width="6" height="12" rx="3" fill="url(#robotDark)" />
        <rect x="11" y="-14" width="5" height="10" rx="2.5" fill="url(#robotDark)" />
      </g>
    </g>

    <!-- Right Arm Holding Book -->
    <g transform="translate(60, 80)">
      <circle cx="0" cy="0" r="14" fill="url(#robotDark)" stroke="#F2B90C" stroke-width="2" />
      <path d="M 0 0 Q 30 30, 20 60" fill="none" stroke="url(#robotBody)" stroke-width="20" stroke-linecap="round" />
      <!-- Textbook -->
      <g transform="translate(10, 25) rotate(-10)">
        <rect x="0" y="0" width="65" height="80" rx="6" fill="url(#bookCover)" stroke="url(#goldBorder)" stroke-width="4" />
        <rect x="62" y="4" width="8" height="72" rx="2" fill="#FFF3B0" />
        <!-- Gold S Emblem on Book -->
        <text x="32" y="52" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="36" fill="url(#goldBorder)" text-anchor="middle">S</text>
      </g>
    </g>

    <!-- Neck -->
    <rect x="-22" y="38" width="44" height="24" rx="6" fill="url(#robotDark)" stroke="#F2B90C" stroke-width="2" />

    <!-- Head Shell -->
    <path d="M -100 -20 
             C -100 -95, -70 -130, 0 -130 
             C 70 -130, 100 -95, 100 -20 
             C 100 45, 65 60, 0 60 
             C -65 60, -100 45, -100 -20 Z" 
          fill="url(#robotBody)" 
          stroke="#E2E8F0" 
          stroke-width="4" />

    <!-- Visor Screen -->
    <path d="M -80 -15 
             C -80 -70, -50 -95, 0 -95 
             C 50 -95, 80 -70, 80 -15 
             C 80 30, 50 42, 0 42 
             C -50 42, -80 30, -80 -15 Z" 
          fill="url(#visorGrad)" 
          stroke="url(#goldBorder)" 
          stroke-width="3" />

    <!-- Glowing Gold Eyes -->
    <g filter="url(#eyeGlow)">
      <!-- Left Eye -->
      <ellipse cx="-35" cy="-25" rx="15" ry="22" fill="url(#goldEye)" />
      <!-- Right Eye -->
      <ellipse cx="35" cy="-25" rx="15" ry="22" fill="url(#goldEye)" />
      <!-- Eye Pupil Highlights -->
      <ellipse cx="-31" cy="-30" rx="5" ry="8" fill="#FFFFFF" />
      <ellipse cx="39" cy="-30" rx="5" ry="8" fill="#FFFFFF" />
    </g>

    <!-- Cute Smiling Mouth LED -->
    <path d="M -18 12 Q 0 28, 18 12" fill="none" stroke="url(#goldEye)" stroke-width="5" stroke-linecap="round" filter="url(#eyeGlow)" />

    <!-- Headphones -->
    <!-- Left Cup -->
    <rect x="-114" y="-45" width="22" height="60" rx="11" fill="url(#robotDark)" stroke="url(#goldBorder)" stroke-width="3" />
    <rect x="-106" y="-35" width="10" height="40" rx="5" fill="#F2B90C" />
    <!-- Right Cup -->
    <rect x="92" y="-45" width="22" height="60" rx="11" fill="url(#robotDark)" stroke="url(#goldBorder)" stroke-width="3" />
    <rect x="96" y="-35" width="10" height="40" rx="5" fill="#F2B90C" />
    <!-- Headband -->
    <path d="M -95 -45 C -85 -145, 85 -145, 95 -45" fill="none" stroke="url(#robotDark)" stroke-width="12" stroke-linecap="round" />
    <path d="M -90 -45 C -80 -140, 80 -140, 90 -45" fill="none" stroke="url(#goldBorder)" stroke-width="3" />

    <!-- Antenna -->
    <line x1="0" y1="-130" x2="0" y2="-160" stroke="url(#goldBorder)" stroke-width="5" stroke-linecap="round" />
    <circle cx="0" cy="-168" r="11" fill="url(#goldEye)" filter="url(#eyeGlow)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- TEXT BADGE BANNER AT BOTTOM -->
  <g transform="translate(250, 410)">
    <!-- Dark Banner Ribbon -->
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#0A0A0A" stroke="url(#goldBorder)" stroke-width="4" filter="url(#shadow3D)" />
    
    <!-- Text -->
    <text x="-35" y="8" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="1.5">STUDY</text>
    <text x="65" y="8" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#F2B90C" letter-spacing="1.5">BUDDY</text>
  </g>
</svg>
