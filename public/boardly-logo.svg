<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 150 440 520" width="1024" height="1024">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="60%" stop-color="#070707" />
      <stop offset="100%" stop-color="#020202" />
    </radialGradient>

    <!-- Main Gold Light Gradient -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#D49B00" />
      <stop offset="90%" stop-color="#996800" />
      <stop offset="100%" stop-color="#5C3E00" />
    </linearGradient>

    <linearGradient id="goldFacetLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE875" />
      <stop offset="40%" stop-color="#F2B800" />
      <stop offset="100%" stop-color="#B88200" />
    </linearGradient>

    <linearGradient id="goldFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="30%" stop-color="#E6AF00" />
      <stop offset="70%" stop-color="#A87400" />
      <stop offset="100%" stop-color="#664600" />
    </linearGradient>

    <!-- Metallic Dark Steel Pages -->
    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E54" />
      <stop offset="40%" stop-color="#2A2D32" />
      <stop offset="80%" stop-color="#141618" />
      <stop offset="100%" stop-color="#090A0B" />
    </linearGradient>

    <!-- Gold Accent Rim -->
    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88200" />
      <stop offset="50%" stop-color="#FFE266" />
      <stop offset="100%" stop-color="#996800" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Center Group -->
  <g transform="translate(0, -10)" filter="url(#subtleShadow)">

    <!-- ==================== TOP SECTION: THE 'B' WITH CHECKMARK ==================== -->
    
    <!-- Left Vertical Stem of B -->
    <path d="M 270 180 L 320 180 L 320 440 L 270 440 Z" fill="url(#goldFacetLeft)" />
    
    <!-- Top Diagonal Bevel Corner on Left Stem -->
    <path d="M 270 180 L 320 180 L 320 230 L 270 230 Z" fill="url(#goldBright)" opacity="0.9" />

    <!-- Top Loop & Upper Arch of B -->
    <path d="M 320 180 C 420 180 530 200 530 280 C 530 330 480 360 410 365 L 320 365 L 320 315 L 400 315 C 440 315 470 300 470 270 C 470 240 430 230 370 230 L 320 230 Z" fill="url(#goldFacetRight)" />

    <!-- Lower Loop & Arch of B -->
    <path d="M 320 360 C 430 360 550 380 550 460 C 550 540 430 560 320 560 L 270 560 L 270 510 L 320 510 C 420 510 490 495 490 455 C 490 415 420 410 350 410 L 320 410 Z" fill="url(#goldBright)" />

    <!-- The INNER CHECKMARK (✓) embedded into the heart of the B -->
    <!-- Short left stroke of checkmark -->
    <path d="M 340 370 L 400 440 L 435 440 L 355 350 Z" fill="url(#goldBright)" />
    <!-- Long right upward stroke of checkmark -->
    <path d="M 395 440 L 530 290 L 500 260 L 380 415 Z" fill="url(#goldBright)" />

    <!-- Additional Golden Bevel Highlights for 3D Depth -->
    <path d="M 270 180 L 320 230 L 320 440 L 270 440 Z" fill="url(#goldRim)" opacity="0.4" />


    <!-- ==================== BOTTOM SECTION: OPEN BOOK PAGES ==================== -->
    
    <!-- LAYER 1: Bottom Outer Golden Wings (Book Base) -->
    <!-- Left Bottom Golden Wing -->
    <path d="M 400 610 C 330 630 250 630 200 580 C 230 620 310 660 400 660 C 400 660 400 610 400 610 Z" fill="url(#goldBright)" />
    <!-- Right Bottom Golden Wing -->
    <path d="M 400 610 C 470 630 550 630 600 580 C 570 620 490 660 400 660 C 400 660 400 610 400 610 Z" fill="url(#goldFacetRight)" />

    <!-- LAYER 2: Middle Dark Steel Pages -->
    <!-- Left Dark Steel Page -->
    <path d="M 400 595 C 330 615 250 610 210 560 C 240 595 320 635 400 635 Z" fill="url(#darkSteel)" />
    <!-- Right Dark Steel Page -->
    <path d="M 400 595 C 470 615 550 610 590 560 C 560 595 480 635 400 635 Z" fill="url(#darkSteel)" />

    <!-- LAYER 3: Top Curved Golden Open Pages -->
    <!-- Left Top Golden Page -->
    <path d="M 400 570 C 330 585 240 570 230 530 C 260 565 330 595 400 595 Z" fill="url(#goldBright)" />
    <!-- Right Top Golden Page -->
    <path d="M 400 570 C 470 585 560 570 570 530 C 540 565 470 595 400 595 Z" fill="url(#goldFacetRight)" />

    <!-- Golden Spine V-Notch in the Center -->
    <path d="M 385 570 L 400 650 L 415 570 L 400 585 Z" fill="url(#goldBright)" />

  </g>
</svg>